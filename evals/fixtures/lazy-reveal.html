<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fixture: scroll reveal</title>
<style>body{margin:0;background:#fff;font:32px sans-serif}section{height:900px;padding:80px}
.reveal{opacity:0;transition:opacity .3s}.reveal.in{opacity:1}
.card{background:#334;color:#fff;padding:40px;height:600px}</style></head>
<body><section><h1>Visible hero</h1></section>
<section class="reveal"><div class="card">Card A</div></section>
<section class="reveal"><div class="card">Card B</div></section>
<section class="reveal"><div class="card">Card C</div></section>
<script>
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) e.target.classList.add('in'); }), {threshold: 0.2});
document.querySelectorAll('.reveal').forEach(el => io.observe(el));
</script></body></html>
