<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fixture: custom scroll container</title>
<style>html,body{margin:0;height:100%;overflow:hidden}.scroller{position:fixed;inset:0;overflow-y:auto}
section{height:900px;display:flex;align-items:center;justify-content:center;font:48px sans-serif}
section:nth-child(odd){background:#f3e0c0}section:nth-child(even){background:#c0d8f3}</style></head>
<body><div class="scroller"><section><h1>One</h1></section><section><h2>Two</h2></section><section><h2>Three</h2></section><section><h2>Four</h2></section></div></body></html>
