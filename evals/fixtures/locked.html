<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fixture: scroll locked</title>
<style>html,body{margin:0;height:100%;overflow:hidden}section{height:900px;font:48px sans-serif;display:flex;align-items:center;justify-content:center}
section:nth-child(odd){background:#eee}section:nth-child(even){background:#ccc}</style></head>
<body><section><h1>Locked</h1><a href="/x" style="padding:12px 24px;background:#000;color:#fff">Enter</a></section><section><h2>Hidden below</h2></section>
<script>
['wheel','touchmove','keydown'].forEach(t => window.addEventListener(t, e => e.preventDefault(), {passive:false}));
window.scrollTo = () => {};
</script></body></html>
